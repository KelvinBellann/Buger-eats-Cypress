name: Buger Eats Security

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  security-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress security suite
        uses: cypress-io/github-action@v6
        with:
          install: false
          command: npm run test:security

      - name: Upload security artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buger-eats-security-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 7
